name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # One job per triple so a missing cross-linker fails loudly here rather than
  # silently shipping two of the three platforms.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            arch: x64
            libc: glibc
          - target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            arch: arm64
            libc: glibc
          - target: x86_64-unknown-linux-musl
            suffix: linux-x64-musl
            arch: x64
            libc: musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Assemble platform package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          PKG=dist/bevel-${{ matrix.suffix }}
          mkdir -p "$PKG/bin"
          cp target/${{ matrix.target }}/release/bevel "$PKG/bin/bevel"
          chmod +x "$PKG/bin/bevel"
          cat > "$PKG/package.json" <<JSON
          {
            "name": "@orovp/bevel-${{ matrix.suffix }}",
            "version": "$VERSION",
            "description": "bevel binary for ${{ matrix.suffix }}",
            "license": "MIT",
            "os": ["linux"],
            "cpu": ["${{ matrix.arch }}"],
            "libc": ["${{ matrix.libc }}"],
            "files": ["bin/bevel"],
            "main": "bin/bevel"
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: bevel-${{ matrix.suffix }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Platform packages first. Publishing the wrapper ahead of them leaves a
      # window where an install resolves no binary at all.
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in dist/bevel-linux-*; do
            (cd "$pkg" && npm publish --access public)
          done

      - name: Publish wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist/bevel/bin
          cp npm/bevel/bin/bevel.js npm/bevel/bin/postinstall.js dist/bevel/bin/
          cp README.md LICENSE dist/bevel/
          sed "s/\"0\.1\.0\"/\"$VERSION\"/g" npm/bevel/package.json > dist/bevel/package.json
          (cd dist/bevel && npm publish --access public)

      # crates.io is the second channel, for machines where npm is unreachable.
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish --allow-dirty
